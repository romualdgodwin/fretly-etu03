name: Fretly CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml --cov=app --cov-report=xml:reports/coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore

  scan-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  build:
    needs: [lint, test, scan-repo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: fretly:scan
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: fretly:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: fretly:scan
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: fretly-sbom
          path: sbom.cdx.json

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          IMAGE="ghcr.io/${{ github.repository }}"

          docker tag fretly:scan "$IMAGE:sha-$SHORT_SHA"
          docker tag fretly:scan "$IMAGE:latest"

          docker push "$IMAGE:sha-$SHORT_SHA"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: read

    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      APP_PORT: ${{ vars.APP_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure secure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" "whoami"

      - name: Prepare production environment
        env:
          API_KEY: ${{ secrets.API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          umask 077
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$SHORT_SHA"

          {
            printf 'POSTGRES_USER=fretly\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=fretly\n'
            printf 'API_KEY=%s\n' "$API_KEY"
            printf 'APP_ENV=production\n'
            printf 'APP_VERSION=1.0.0\n'
            printf 'IMAGE_TAG=%s\n' "$IMAGE"
          } > .env

          chmod 600 .env

      - name: Copy configuration to EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            'mkdir -p /home/etu03/fretly &&
             chmod 700 /home/etu03/fretly &&
             touch /home/etu03/fretly/.env &&
             chmod 600 /home/etu03/fretly/.env'

          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            compose.prod.yaml .env \
            "$EC2_USER@$EC2_HOST:/home/etu03/fretly/"

          rm -f .env

      - name: Pull and start containers
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" '
              set -eu
              cd /home/etu03/fretly

              export DOCKER_CONFIG=$(mktemp -d)
              trap "rm -rf \"$DOCKER_CONFIG\"" EXIT

              docker login ghcr.io \
                -u romualdgodwin \
                --password-stdin

              docker compose -f compose.prod.yaml pull

              docker compose -f compose.prod.yaml \
                up -d --wait --no-build
            '

      - name: Smoke tests
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            "http://$EC2_HOST:$APP_PORT/health" \
            -o health.json

          curl --fail --silent --show-error \
            "http://$EC2_HOST:$APP_PORT/version" \
            -o version.json

          python3 - <<'PY'
          import json
          import os

          with open("health.json") as f:
              health = json.load(f)

          with open("version.json") as f:
              version = json.load(f)

          assert health["status"] == "ok"
          assert version["commit"] == os.environ["GITHUB_SHA"]

          print("Health OK")
          print("Version OK:", version["commit"])
          PY
